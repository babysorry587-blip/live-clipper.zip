<!doctype html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Clipper</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f0f14">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f0f14;color:#eee;padding:16px;max-width:560px;margin:auto}
input,button{width:100%;padding:12px;border-radius:10px;border:0;font-size:16px;margin:4px 0;box-sizing:border-box}
input{background:#1c1c26;color:#fff}button{background:#7c4dff;color:#fff;font-weight:600}
button.g{background:#2a2a38}.row{display:flex;gap:8px}.row button{flex:1}
.card{background:#1c1c26;border-radius:12px;padding:12px;margin:10px 0}video{width:100%;border-radius:8px}small{color:#9a9ab0}
</style></head><body>
<h2>🎬 Live Clipper</h2>
<input id="key" type="password" placeholder="Groq API key (gsk_...)" onchange="localStorage.k=this.value">
<input id="url" placeholder="YouTube / Twitch live link">
<div class="row"><button onclick="go('start',{url:url.value})">▶ Start</button><button class="g" onclick="go('stop')">■ Stop</button></div>
<div class="card" id="st">Status...</div>
<div class="row"><button onclick="clip(30)">✂ 30s</button><button onclick="clip(60)">✂ 60s</button><button onclick="clip(90)">✂ 90s</button></div>
<button onclick="ai()">✨ AI Clip (Groq: title + score)</button>
<button class="g" id="auto" onclick="auto()">Auto-clip: OFF</button>
<div id="msg"><small></small></div><div id="clips"></div>
<script>
let A=false;const $=id=>document.getElementById(id);
const go=(p,b)=>fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json','X-Groq-Key':$('key').value},body:JSON.stringify(b||{})}).then(r=>r.json());
async function clip(s){msg('Clip ban rahi hai...');try{const r=await go('clip',{seconds:s});msg('Ready: '+r.file);load()}catch(e){msg('Error')}}
async function ai(){msg('AI analyze kar raha hai...');try{const r=await go('ai',{seconds:60});msg('⭐ '+r.score+'/10 — '+r.title);load()}catch(e){msg('Error (Groq key check karo)')}}
async function auto(){A=!A;await go('auto',{on:A,key:$('key').value});$('auto').textContent='Auto-clip: '+(A?'ON (score ≥7)':'OFF')}
const msg=t=>$('msg').innerHTML='<small>'+t+'</small>';
async function load(){const s=await (await fetch('/api/status')).json();A=s.auto;
$('st').innerHTML=(s.running?'🟢 Recording':'⚪ Stopped')+' — buffer: '+s.buffer+'s';
$('clips').innerHTML=s.clips.map(c=>'<div class="card"><video controls preload="metadata" src="/clips/'+c+'"></video><a style="color:#b39dff" href="/clips/'+c+'" download>⬇ '+c+'</a></div>').join('')}
$('key').value=localStorage.k||'';setInterval(load,5000);load();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
